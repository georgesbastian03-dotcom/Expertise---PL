# Publie une release quand APP_VERSION (updater.py) change sur main : le
# programme y trouve le .zip à télécharger. Les notes de version sont celles
# de notes_de_version.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: v
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' updater.py)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Construire et publier
        if: steps.v.outputs.existe != 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git archive --format=zip --prefix=rapports_permis_location/ -o "rapports_permis_location_${TAG}.zip" HEAD
          gh release create "$TAG" "rapports_permis_location_${TAG}.zip" \
            --target "$GITHUB_SHA" --title "Version ${TAG#v}" --notes-file notes_de_version.md
