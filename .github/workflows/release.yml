# Publie une release dès qu'un tag « vX.Y.Z » est poussé : le programme
# (updater.py) y trouve le .zip à télécharger. Les notes de version sont
# reprises du message du tag annoté.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que APP_VERSION correspond au tag
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' updater.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "APP_VERSION=$version mais tag=$GITHUB_REF_NAME"; exit 1; }

      - name: Construire le .zip
        run: git archive --format=zip --prefix=rapports_permis_location/ -o "rapports_permis_location_${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "rapports_permis_location_${GITHUB_REF_NAME}.zip" \
            --title "Version ${GITHUB_REF_NAME#v}" --notes-from-tag
